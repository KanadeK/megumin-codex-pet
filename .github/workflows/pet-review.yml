name: Pet atlas review

on:
  pull_request:
    paths:
      - "pet/**"
      - "examples/*policy.json"
      - "src/megumin_pet/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - name: Obtain base-branch lock
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ -n "$BASE_REF" ]]; then
            git show "origin/$BASE_REF:pet/pet.lock.json" > build-base.lock.json
          else
            cp pet/pet.lock.json build-base.lock.json
          fi
      - name: Run PetDiff
        run: |
          petdiff compare build-base.lock.json pet \
            --policy examples/review-policy.json \
            --json-out build/petdiff.json \
            --html-out build/petdiff.html
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: petdiff-review
          path: build/
