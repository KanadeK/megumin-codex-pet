name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Strict release check
        run: python scripts/release_check.py --strict --json
      - name: Build Python artifacts
        run: python -m build
      - name: Build pet archive
        run: petdiff package pet --out dist/megumin-${{ github.ref_name }}.codex-pet
      - name: Checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*
